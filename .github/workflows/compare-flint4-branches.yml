name: Compare Flint 4 Exact Branches

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Flint 4 repository
        run: |
          git clone https://github.com/JiaY-shi/openwrt.git openwrt
          cd openwrt

          git checkout flint4-support
          git fetch origin \
            flint4-support-blogic-pr \
            flint4-offload-blogic-review

      - name: Show branch heads
        run: |
          cd openwrt

          echo "========================================"
          echo "BRANCH HEADS"
          echo "========================================"

          git log -1 --oneline flint4-support

          echo
          git log -1 --oneline origin/flint4-support-blogic-pr

          echo
          git log -1 --oneline origin/flint4-offload-blogic-review

      - name: Cherry comparison support PR
        run: |
          cd openwrt

          echo "========================================"
          echo "flint4-support -> flint4-support-blogic-pr"
          echo "========================================"

          git log \
            --left-right \
            --cherry-pick \
            --no-merges \
            --oneline \
            flint4-support...origin/flint4-support-blogic-pr

      - name: Cherry comparison offload review
        run: |
          cd openwrt

          echo "========================================"
          echo "flint4-support -> flint4-offload-blogic-review"
          echo "========================================"

          git log \
            --left-right \
            --cherry-pick \
            --no-merges \
            --oneline \
            flint4-support...origin/flint4-offload-blogic-review

      - name: Collect files touched by known 19 commits
        run: |
          cd openwrt

          COMMITS=(
            d4d71d8c55cd49389c769236b07441adbd58e370
            6b300b532bf58bb0251905a09bffe1788322f435
            e2df5a1c436da057821b52b958df6c4fd73a9d10
            62707ad6a242dcdb6c3059e3811b6bdd3308bfd0
            da6ee10f4aa054e7d396e130cdd4405c43480bbc
            55f15d88b6dc68965eec7ea893dc0db21b659c73
            ed84b0aacfcb8bc62f435ba47cf5f523205eb3b8
            35ada6b9f41cebd1a98e83e4b99cfb71fedb64e9
            b1e81abd32ed4369fc1d413b5c33b6ce8ca5a3eb
            57c66e245ea735554d864b269726c14e3120c72a
            014ad5d2682906e4ae6fcce7bb196192529a9594
            dfa73b346fb74027ff017de239f9d03002ad128a
            b87cffe24d576fe49c940239c2d3d89a00a68c3d
            ee4cd1f8ea93bfa5af75344685febad00fe819ba
            0c853dd139ef120c13402c2c7f13d927722d61ef
            7289ad3424945127eacfd6a2016cd0c1fd3de61d
            8afac3fd27f032563cd601633b0f646cf7cff11c
            965af1a746277d281d8f0277de32d4ad73152c6d
            8fe7ba853d28cbb9f8a9e104d3fcde960fd96dae
          )

          git remote add blogic https://github.com/blogic/openwrt.git || true

          for c in "${COMMITS[@]}"; do
            git fetch --no-tags blogic "$c"
          done

          {
            for c in "${COMMITS[@]}"; do
              git show --pretty='' --name-only "$c"
            done
          } | sed '/^$/d' | sort -u > /tmp/flint4-files.txt

          echo "========================================"
          echo "FILES TO COMPARE"
          echo "========================================"

          cat /tmp/flint4-files.txt

      - name: Compare relevant files with support PR
        run: |
          cd openwrt

          echo "========================================"
          echo "TREE DIFF vs flint4-support-blogic-pr"
          echo "========================================"

          while IFS= read -r f; do
            if ! git diff --quiet \
              flint4-support \
              origin/flint4-support-blogic-pr \
              -- "$f"; then

              echo
              echo "########################################"
              echo "DIFFERENT: $f"
              echo "########################################"

              git diff \
                --stat \
                flint4-support \
                origin/flint4-support-blogic-pr \
                -- "$f"

              git diff \
                --unified=3 \
                flint4-support \
                origin/flint4-support-blogic-pr \
                -- "$f" | head -200
            fi
          done < /tmp/flint4-files.txt

      - name: Compare relevant files with offload review
        run: |
          cd openwrt

          echo "========================================"
          echo "TREE DIFF vs flint4-offload-blogic-review"
          echo "========================================"

          while IFS= read -r f; do
            if ! git diff --quiet \
              flint4-support \
              origin/flint4-offload-blogic-review \
              -- "$f"; then

              echo
              echo "########################################"
              echo "DIFFERENT: $f"
              echo "########################################"

              git diff \
                --stat \
                flint4-support \
                origin/flint4-offload-blogic-review \
                -- "$f"

              git diff \
                --unified=3 \
                flint4-support \
                origin/flint4-offload-blogic-review \
                -- "$f" | head -200
            fi
          done < /tmp/flint4-files.txt
