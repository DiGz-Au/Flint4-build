name: Compare Flint 4 Branches

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone flint4-support baseline
        run: |
          git clone \
            -b flint4-support \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

      - name: Add Blogic remote
        run: |
          cd openwrt

          git remote add blogic https://github.com/blogic/openwrt.git
          git fetch blogic --prune

      - name: Show Blogic remote branches
        run: |
          cd openwrt

          echo "========================================"
          echo "BLOGIC REMOTE BRANCHES"
          echo "========================================"

          git branch -r | grep blogic || true

      - name: Compare known Flint 4 branch candidates
        run: |
          cd openwrt

          echo "========================================"
          echo "BASELINE"
          echo "========================================"
          git log -1 --oneline HEAD

          echo
          echo "========================================"
          echo "SEARCHING BLOGIC FLINT 4 BRANCHES"
          echo "========================================"

          git branch -r | grep -Ei 'blogic/.*(flint|be14000|yt922|review|support)' || true

      - name: Compare against Blogic branches
        run: |
          cd openwrt

          echo "========================================"
          echo "PATCH-EQUIVALENCE COMPARISON"
          echo "========================================"

          for branch in $(git branch -r | sed 's/^ *//' | grep -Ei '^blogic/.*(flint|be14000|yt922|review|support)'); do
            echo
            echo "########################################"
            echo "BRANCH: $branch"
            echo "########################################"

            echo
            echo "----- git cherry -----"
            git cherry -v HEAD "$branch" || true

            echo
            echo "----- right-only unique commits -----"
            git log \
              --cherry-pick \
              --right-only \
              --no-merges \
              --oneline \
              HEAD..."$branch" || true
          done

      - name: Compare specific 19 known commits
        run: |
          cd openwrt

          COMMITS=(
            d4d71d8c55cd49389c769236b07441adbd58e370
            6b300b532bf58bb0251905a09bffe1788322f435
            e2df5a1c436da057821b52b958df6c4fd73a9d10
            62707ad6a242dcdb6c3059e3811b6bdd3308bfd0
            da6ee10f4aa054e7d396e130cdd4405c43480bbc
            55f15d88b6dc68965eec7ea893dc0db21b659c73
            ed84b0aacfcb8bc62f435ba47cf5f523205eb3b8
            35ada6b9f41cebd1a98e83e4b99cfb71fedb64e9
            b1e81abd32ed4369fc1d413b5c33b6ce8ca5a3eb
            57c66e245ea735554d864b269726c14e3120c72a
            014ad5d2682906e4ae6fcce7bb196192529a9594
            dfa73b346fb74027ff017de239f9d03002ad128a
            b87cffe24d576fe49c940239c2d3d89a00a68c3d
            ee4cd1f8ea93bfa5af75344685febad00fe819ba
            0c853dd139ef120c13402c2c7f13d927722d61ef
            7289ad3424945127eacfd6a2016cd0c1fd3de61d
            8afac3fd27f032563cd601633b0f646cf7cff11c
            965af1a746277d281d8f0277de32d4ad73152c6d
            8fe7ba853d28cbb9f8a9e104d3fcde960fd96dae
          )

          git fetch blogic "${COMMITS[@]}" || true

          echo "========================================"
          echo "KNOWN 19 COMMIT PATCH STATUS"
          echo "========================================"

          for commit in "${COMMITS[@]}"; do
            echo
            echo "----------------------------------------"

            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "$commit"
              echo "NOT FETCHED / NOT FOUND"
              continue
            fi

            git show -s --format='%H %s' "$commit"

            if git cherry HEAD "$commit" 2>/dev/null | grep -q '^+'; then
              echo "STATUS: PATCH NOT EQUIVALENT IN BASELINE"
            else
              echo "STATUS: PATCH ALREADY REPRESENTED OR NOT DIRECTLY COMPARABLE"
            fi
          done
