name: Build Flint 4 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget device-tree-compiler

      - name: Checkout Repository
        run: |
          git clone --depth 1 -b flint4-support https://github.com/JiaY-shi/openwrt.git openwrt

      - name: Add Blogic Feed & Update Feeds
        run: |
          cd openwrt
          # Add blogic package feed containing glinet-panel-ui and ucode-mod-lvgl
          echo "src-git blogic https://github.com/blogic/feed-blogic.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Target Configuration
        run: |
          cd openwrt
          # Explicitly target MT7988 platform and Flint 4 profile
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7988=y
          CONFIG_TARGET_mediatek_mt7988_DEVICE_glinet_gl-be14000=y
          EOF
          make defconfig

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Artifacts
        run: |
          mkdir -p bin-artifacts
          find openwrt/bin/targets/ -type f \( -name "*.bin" -o -name "*.manifest" \) -exec cp {} bin-artifacts/ \;

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-BE14000-OpenWrt-Firmware
          path: bin-artifacts/
