name: Build Flint 4 Firmware with Touchscreen UI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget device-tree-compiler

      - name: Checkout Repository
        run: |
          git clone --depth 1 -b flint4-support https://github.com/JiaY-shi/openwrt.git openwrt

      - name: Add Blogic Feed & Clean Conflicts
        run: |
          cd openwrt
          echo "src-git blogic https://github.com/blogic/feed-blogic.git" >> feeds.conf.default
          ./scripts/feeds update -a
          
          # Remove conflicting librespeed files to prevent Kconfig recursion errors
          rm -rf feeds/packages/net/librespeed*
          rm -rf feeds/luci/applications/luci-app-librespeed
          
          # Install only the specific panel UI package
          ./scripts/feeds install glinet-panel-ui

      - name: Generate Target Configuration
        run: |
          cd openwrt
          make defconfig
          # Enable the panel UI and graphics dependencies
          echo "CONFIG_PACKAGE_glinet-panel-ui=y" >> .config
          echo "CONFIG_PACKAGE_lvgl=y" >> .config
          echo "CONFIG_PACKAGE_ucode-mod-lvgl=y" >> .config
          make defconfig

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Prepare Artifacts
        run: |
          mkdir -p bin-artifacts
          find openwrt/bin/targets/ -type f \( -name "*sysupgrade.bin" -o -name "*.manifest" \) -exec cp {} bin-artifacts/ \;

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-BE14000-OpenWrt-Touchscreen-Firmware
          path: bin-artifacts/
