name: Build Flint 4 Touchscreen Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 Firmware with Panel UI
    runs-on: ubuntu-22.04

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget device-tree-compiler

      - name: Checkout Repository
        run: |
          git clone --depth 1 -b flint4-support https://github.com/JiaY-shi/openwrt.git openwrt

      - name: Add Blogic Feed & Clean Conflicts
        run: |
          cd openwrt
          echo "src-git blogic https://github.com/blogic/feed-blogic.git" >> feeds.conf.default
          ./scripts/feeds update -a
          
          # Remove conflicting librespeed files to prevent Kconfig recursion errors
          rm -rf feeds/packages/net/librespeed*
          rm -rf feeds/luci/applications/luci-app-librespeed
          
          # Install the panel UI package
          ./scripts/feeds install glinet-panel-ui

      - name: Generate Target Configuration
        run: |
          cd openwrt
          make defconfig
          
          # Explicitly target MediaTek Filogic and the GL-BE14000 device profile
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y" >> .config
          
          # Bake in the panel UI and its graphics requirements
          echo "CONFIG_PACKAGE_glinet-panel-ui=y" >> .config
          echo "CONFIG_PACKAGE_lvgl=y" >> .config
          echo "CONFIG_PACKAGE_ucode-mod-lvgl=y" >> .config
          
          # Run defconfig again to resolve dependencies and clean up the config
          make defconfig

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make V=s

      - name: Prepare Artifacts
        run: |
          mkdir -p firmware-artifacts
          # Copy all bin files and manifests for the gl-be14000 profile
          find openwrt/bin/targets/ -type f \( -name "*gl-be14000*.bin" -o -name "*gl-be14000*.manifest" \) -exec cp {} firmware-artifacts/ \;
          ls -lh firmware-artifacts/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-BE14000-Touchscreen-Firmware
          path: firmware-artifacts/
