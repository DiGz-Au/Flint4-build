name: Build Flint 4 BE14000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository Branch
        uses: actions/checkout@v4
        with:
          repository: JiaY-shi/openwrt
          ref: flint4-support-blogic-pr

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/packages/net/librespeed*
          rm -rf feeds/luci/applications/luci-app-librespeed

      - name: Configure Target for GL-BE14000
        run: |
          make defconfig
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICES_mediatek_filogic_DEVICE_glinet_gl-be14000=y" >> .config
          make olddefconfig
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Compile Firmware
        run: |
          make -j$(nproc)

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flint4-be14000-firmware
          path: bin/targets/mediatek/filogic/*
