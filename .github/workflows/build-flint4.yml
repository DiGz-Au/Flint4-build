name: Build Flint 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Flint 4 (GL-BE14000)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout Flint 4 branch
        uses: actions/checkout@v4
        with:
          repository: JiaY-shi/openwrt
          ref: flint4-support-blogic-pr
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            qemu-utils

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select Flint 4 target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y
          EOF

          make defconfig

      - name: Show configuration
        run: |
          echo "=== OpenWrt revision ==="
          git log -1 --oneline

          echo
          echo "=== Target ==="
          grep '^CONFIG_TARGET_' .config | head -50

          echo
          echo "=== Flint 4 ==="
          grep -i 'gl-be14000' .config || true

      - name: Download sources
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          make -j"$(nproc)" V=s

      - name: Show firmware
        if: success()
        run: |
          echo "=== Firmware files ==="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -print | sort

      - name: Generate SHA256 checksums
        if: success()
        run: |
          cd bin/targets/mediatek/filogic

          sha256sum \
            *.bin \
            *.itb \
            *.gz \
            2>/dev/null > sha256sums.txt || true

          cat sha256sums.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flint4-gl-be14000
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/*.gz
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/*.json
            bin/targets/mediatek/filogic/sha256sums.txt
          if-no-files-found: error
          retention-days: 30
