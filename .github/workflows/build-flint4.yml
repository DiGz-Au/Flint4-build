name: Build Flint 4 Firmware - Panel UI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt with Panel UI
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # Maximize Build Space
      # ============================================================
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ============================================================
      # Build Dependencies
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler

      # ============================================================
      # Checkout the known-good Flint 4 branch
      # ============================================================
      - name: Checkout Repository
        run: |
          git clone \
            --depth 1 \
            -b flint4-support \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

      # ============================================================
      # Add Blogic Panel UI Feed
      # ============================================================
      - name: Add Blogic Panel Feed
        run: |
          cd openwrt

          echo "src-git blogic https://github.com/blogic/feed-blogic.git" \
            >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Fix BE14000 Touchscreen Rotation
      #
      # Existing DTS already has:
      #   touchscreen-swapped-x-y;
      #
      # The production BE14000 panel is mounted 180 degrees
      # around, so also invert both axes.
      # ============================================================
      - name: Fix BE14000 Touchscreen Rotation
        run: |
          cd openwrt

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/mediatek/dts/"
              "mt7988a-glinet-gl-be14000.dts"
          )

          if not p.exists():
              raise SystemExit(
                  f"ERROR: BE14000 DTS not found: {p}"
              )

          s = p.read_text()

          # Already fixed?
          if (
              "touchscreen-swapped-x-y;" in s
              and "touchscreen-inverted-x;" in s
              and "touchscreen-inverted-y;" in s
          ):
              print("Touchscreen rotation fix already present.")
              raise SystemExit(0)

          old = "touchscreen-swapped-x-y;"

          new = """touchscreen-swapped-x-y;
                  touchscreen-inverted-x;
                  touchscreen-inverted-y;"""

          if old not in s:
              raise SystemExit(
                  "ERROR: touchscreen-swapped-x-y was not found "
                  "in the BE14000 DTS."
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("Applied BE14000 180-degree touchscreen fix.")
          PY

          echo
          echo "===== Touchscreen DTS ====="

          grep -A12 -B4 "touchscreen@58" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

      # ============================================================
      # Generate Target Configuration
      #
      # IMPORTANT:
      # This is kept EXACTLY based on the known-good Flint 4
      # configuration you supplied.
      # ============================================================
      - name: Generate Target Configuration
        run: |
          cd openwrt

          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y

          # Standard LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # GL.iNet front-panel UI
          CONFIG_PACKAGE_glinet-panel-ui=y
          CONFIG_PACKAGE_ucode-mod-lvgl=y
          EOF

          make defconfig

      # ============================================================
      # Show Important Configuration
      # ============================================================
      - name: Verify Flint 4 Configuration
        run: |
          cd openwrt

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET_mediatek|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000' \
            .config || true

          echo
          echo "========================================"
          echo "PANEL UI"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(glinet-panel-ui|ucode-mod-lvgl|lvgl)' \
            .config || true

          echo
          echo "========================================"
          echo "TOUCHSCREEN"
          echo "========================================"

          grep -A10 -B3 "touchscreen@58" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts || true

      # ============================================================
      # Download Source Packages
      # ============================================================
      - name: Download Source Packages
        run: |
          cd openwrt

          make download -j$(nproc)

          find dl -size -1024c -exec rm -f {} \;

      # ============================================================
      # Compile Firmware
      # ============================================================
      - name: Compile Firmware
        run: |
          cd openwrt

          echo "Building on $(nproc) cores..."

          make -j$(nproc) || make -j1 V=s

      # ============================================================
      # Prepare Artifacts
      # ============================================================
      - name: Prepare Artifacts
        run: |
          cd openwrt

          mkdir -p ../firmware-out

          find bin/targets/mediatek/filogic/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.manifest" \
            \) \
            -exec cp {} ../firmware-out/ \;

          echo
          echo "========================================"
          echo "BUILD ARTIFACTS"
          echo "========================================"

          ls -lah ../firmware-out

      # ============================================================
      # Upload Firmware
      # ============================================================
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flint4-GL-BE14000-OpenWrt-PanelUI
          path: firmware-out
