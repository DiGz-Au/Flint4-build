name: Build Flint 4 - Offload Review

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt
    runs-on: ubuntu-24.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free System Disk Space
        run: |
          echo "=========================================="
          echo "BEFORE CLEANUP"
          echo "=========================================="
          df -h /

          echo
          echo "Removing large preinstalled components..."

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "=========================================="
          echo "AFTER CLEANUP"
          echo "=========================================="
          df -h /

          echo
          echo "=========================================="
          echo "BUILD WORKSPACE"
          echo "=========================================="
          df -h "$GITHUB_WORKSPACE"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler

      - name: Check Disk Space
        run: |
          echo "=========================================="
          echo "ROOT FILESYSTEM"
          echo "=========================================="
          df -h /

          echo
          echo "=========================================="
          echo "BUILD WORKSPACE"
          echo "=========================================="
          df -h "$GITHUB_WORKSPACE"

      - name: Checkout Flint 4 Source
        run: |
          git clone --depth 1 \
            -b flint4-offload-blogic-review \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

      - name: Show Source Revision
        run: |
          cd openwrt

          echo "=========================================="
          echo "OPENWRT SOURCE"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git log -1 --format='%H'

          echo
          echo "Date:"
          git log -1 --format='%ci'

          echo
          echo "Subject:"
          git log -1 --format='%s'

          echo
          echo "=========================================="
          echo "FEEDS CONFIGURATION"
          echo "=========================================="

          cat feeds.conf.default

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Show Feed Revisions
        run: |
          cd openwrt

          echo "=========================================="
          echo "FEED REVISIONS"
          echo "=========================================="

          for feed in feeds/*; do
            if [ -d "$feed/.git" ]; then
              echo
              echo "[$feed]"
              git -C "$feed" log -1 --format='%H %ci %s'
            fi
          done

      - name: Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Diagnose LibreSpeed Definitions
        run: |
          cd openwrt

          echo "=========================================="
          echo "LIBRESPEED FILES"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -iname '*librespeed*' \
              -o -name 'Makefile' \
              -o -name 'Config.in' \
            \) \
            -print \
            2>/dev/null | grep -i librespeed || true

          echo
          echo "=========================================="
          echo "LIBRESPEED REFERENCES"
          echo "=========================================="

          grep -Rni \
            -E \
            'librespeed-cli|librespeed-common|librespeed-cli-rust|luci-app-librespeed' \
            package \
            feeds \
            include \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "GENERATED KCONFIG REFERENCES"
          echo "=========================================="

          if [ -f tmp/.config-package.in ]; then
            grep -n -B5 -A10 \
              -E \
              'librespeed-cli|librespeed-common|librespeed-cli-rust|luci-app-librespeed' \
              tmp/.config-package.in || true
          else
            echo "tmp/.config-package.in does not exist yet"
          fi

      - name: Generate Target Configuration
        run: |
          cd openwrt

          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF

          make defconfig

      - name: Show Final Configuration
        run: |
          cd openwrt

          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          grep '^CONFIG_TARGET_' .config | head -100

          echo
          echo "=========================================="
          echo "FLINT 4"
          echo "=========================================="

          grep 'glinet_gl-be14000' .config || true

          echo
          echo "=========================================="
          echo "MULTI PROFILE"
          echo "=========================================="

          grep '^CONFIG_TARGET_MULTI_PROFILE' .config || true

          echo
          echo "=========================================="
          echo "LUCI"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_luci' .config || true

          echo
          echo "=========================================="
          echo "OFFLOAD / BRIDGER"
          echo "=========================================="

          grep -Ei 'bridger|yt922|offload' .config || true

      - name: Download Source Packages
        run: |
          cd openwrt

          make download -j$(nproc)

          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          cd openwrt

          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          echo "CPU cores: $(nproc)"

          echo
          echo "Make version:"
          make --version | head -1

          echo
          echo "Disk space:"
          df -h .

          echo
          echo "Starting build..."

          make -j$(nproc) || make -j1 V=s

      - name: Prepare Artifacts
        if: success()
        run: |
          cd openwrt

          mkdir -p ../firmware-out

          find bin/targets/mediatek/filogic/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.itb" \
              -o -name "*.manifest" \
              -o -name "*.json" \
            \) \
            -exec cp {} ../firmware-out/ \;

          echo
          echo "=========================================="
          echo "GENERATED FIRMWARE"
          echo "=========================================="

          ls -lah ../firmware-out/

      - name: Generate Checksums
        if: success()
        run: |
          cd firmware-out

          sha256sum \
            *.bin \
            *.img \
            *.itb \
            2>/dev/null \
            > sha256sums.txt || true

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat sha256sums.txt || true

      - name: Upload Firmware Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Flint4-GL-BE14000-Offload-Review
          path: firmware-out/*
          retention-days: 30
