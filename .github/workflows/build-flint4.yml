name: Build Flint 4 Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GL.iNet Flint 4 (GL-BE14000)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      TERM: xterm
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Checkout Flint 4 branch
        uses: actions/checkout@v4
        with:
          repository: JiaY-shi/openwrt
          ref: flint4-support-blogic-pr
          fetch-depth: 1

      - name: Show source revision
        run: |
          echo "=== OpenWrt source ==="
          git log -1 --oneline
          echo
          echo "=== Branch ==="
          git branch --show-current

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            device-tree-compiler \
            qemu-utils

      - name: Update feeds
        run: |
          ./scripts/feeds update -a

      - name: Configure Flint 4
        run: |
          export TERM=xterm

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y
          EOF

          echo "=== Initial configuration ==="
          cat .config

          echo
          echo "=== Running defconfig ==="
          make defconfig

      - name: Verify target configuration
        run: |
          echo "=== Target configuration ==="
          grep '^CONFIG_TARGET_' .config | head -100

          echo
          echo "=== Flint 4 ==="
          grep -i 'gl-be14000' .config || true

          echo
          echo "=== Target directory ==="
          ls -la target/linux/mediatek/

      - name: Download sources
        run: |
          make download -j"$(nproc)"

      - name: Remove incomplete downloads
        run: |
          find dl -size -1024c -type f -print -delete || true

      - name: Build firmware
        run: |
          echo "Building Flint 4 with $(nproc) CPU threads..."
          make -j"$(nproc)" V=s

      - name: List generated firmware
        if: success()
        run: |
          echo "========================================"
          echo "Generated Flint 4
