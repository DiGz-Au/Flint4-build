name: Build Flint 4 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # Free runner disk space
      # ------------------------------------------------------------
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler

      # ------------------------------------------------------------
      # Checkout known-good Flint 4 support branch
      # ------------------------------------------------------------
      - name: Checkout Flint 4 Support
        run: |
          git clone --depth 1 \
            -b flint4-support \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

      # ------------------------------------------------------------
      # Add Blogic feed
      #
      # Provides:
      #   glinet-panel-ui
      #   ucode-mod-lvgl
      #   lvgl
      #   panel-related packages
      # ------------------------------------------------------------
      - name: Add Blogic Feed
        working-directory: openwrt
        run: |
          echo "src-git blogic https://github.com/blogic/feed-blogic.git" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # Fix BE14000 touchscreen orientation
      #
      # The panel is mounted 180 degrees around.
      # The existing DTS swaps X/Y but needs both axes inverted too.
      # ------------------------------------------------------------
      - name: Fix BE14000 Touchscreen Rotation
        working-directory: openwrt
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts")

          if not p.exists():
              raise SystemExit(
                  f"ERROR: Could not find {p}"
              )

          s = p.read_text()

          if (
              "touchscreen-inverted-x;" in s
              and "touchscreen-inverted-y;" in s
          ):
              print("Touchscreen rotation fix already present.")
              raise SystemExit(0)

          old = "touchscreen-swapped-x-y;"
          new = """touchscreen-swapped-x-y;
                  touchscreen-inverted-x;
                  touchscreen-inverted-y;"""

          if old not in s:
              raise SystemExit(
                  "ERROR: Could not find touchscreen-swapped-x-y "
                  "in the BE14000 DTS."
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Applied BE14000 180-degree touchscreen correction.")
          PY

          echo
          echo "Touchscreen DTS:"
          grep -A12 -B4 "touchscreen" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts || true

      # ------------------------------------------------------------
      # Generate target configuration
      # ------------------------------------------------------------
      - name: Generate Target Configuration
        working-directory: openwrt
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7988=y
          CONFIG_TARGET_mediatek_mt7988_DEVICE_glinet_gl-be14000=y

          # GL.iNet front-panel UI
          CONFIG_PACKAGE_glinet-panel-ui=y
          EOF

          make defconfig

      # ------------------------------------------------------------
      # Verify panel packages actually made it into the config
      # ------------------------------------------------------------
      - name: Verify Panel Configuration
        working-directory: openwrt
        run: |
          echo "===== Panel packages ====="

          grep -E \
            'CONFIG_PACKAGE_(glinet-panel-ui|glinet-panel-firmware|.*cst353x|ucode-mod-lvgl|lvgl)' \
            .config || true

          echo
          echo "===== Touchscreen DTS ====="

          grep -A8 -B3 "touchscreen" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts || true

          echo
          echo "===== Target ====="

          grep -E \
            'CONFIG_TARGET_mediatek_mt7988|CONFIG_TARGET_mediatek_mt7988_DEVICE_glinet_gl-be14000' \
            .config

      # ------------------------------------------------------------
      # Download sources
      # ------------------------------------------------------------
      - name: Download Source Packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      # ------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------
      - name: Compile Firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      # ------------------------------------------------------------
      # Collect firmware
      # ------------------------------------------------------------
      - name: Prepare Artifacts
        run: |
          mkdir -p bin-artifacts

          find openwrt/bin/targets/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.manifest" \
              -o -name "*.itb" \
              -o -name "*.img" \
            \) \
            -exec cp {} bin-artifacts/ \;

          echo "===== Firmware artifacts ====="
          ls -lah bin-artifacts/

      # ------------------------------------------------------------
      # Upload firmware
      # ------------------------------------------------------------
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-BE14000-OpenWrt-Flint4-PanelUI
          path: bin-artifacts/