name: Build Flint 4 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Free runner disk space
      # ============================================================
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get clean

      # ============================================================
      # Build dependencies
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler

      # ============================================================
      # Flint 4 base
      # ============================================================
      - name: Checkout Flint 4 Support
        run: |
          git clone --depth 1 \
            -b flint4-support \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

      # ============================================================
      # Blogic panel feed
      # ============================================================
      - name: Add Blogic Feed
        working-directory: openwrt
        run: |
          echo "src-git blogic https://github.com/blogic/feed-blogic.git" \
            >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Fix BE14000 touchscreen orientation
      #
      # The physical panel is mounted 180 degrees around.
      # Keep X/Y swapping and invert both axes.
      # ============================================================
      - name: Fix BE14000 Touchscreen Rotation
        working-directory: openwrt
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/mediatek/dts/"
              "mt7988a-glinet-gl-be14000.dts"
          )

          if not p.exists():
              raise SystemExit(
                  f"ERROR: BE14000 DTS not found: {p}"
              )

          s = p.read_text()

          # Fix the explanatory comment if present.
          s = s.replace(
              """/* the panel sits 180 degrees rotated against the BE10000 one,
               * so it needs the swap but neither inversion
               */""",
              """/* The panel is mounted 180 degrees rotated,
               * so the touch axes must be swapped and both axes inverted.
               */"""
          )

          # Add the inversion properties if they aren't already there.
          if "touchscreen-inverted-x;" not in s:
              old = "touchscreen-swapped-x-y;"
              new = """touchscreen-swapped-x-y;
                  touchscreen-inverted-x;
                  touchscreen-inverted-y;"""

              if old not in s:
                  raise SystemExit(
                      "ERROR: touchscreen-swapped-x-y was not found"
                  )

              s = s.replace(old, new, 1)

          elif "touchscreen-inverted-y;" not in s:
              old = "touchscreen-inverted-x;"
              s = s.replace(
                  old,
                  """touchscreen-inverted-x;
                  touchscreen-inverted-y;""",
                  1
              )

          p.write_text(s)

          print("BE14000 touchscreen rotation fix applied.")
          PY

          echo "===== Touchscreen configuration ====="
          grep -A12 -B4 "touchscreen@58" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

      # ============================================================
      # Configure target and panel UI
      # ============================================================
      - name: Generate Target Configuration
        working-directory: openwrt
        run: |
          cat << 'EOF' > .config

          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7988=y
          CONFIG_TARGET_mediatek_mt7988_DEVICE_glinet_gl-be14000=y

          # ========================================================
          # Flint 4 front-panel UI
          # ========================================================

          CONFIG_PACKAGE_glinet-panel-ui=y
          CONFIG_PACKAGE_ucode-mod-lvgl=y

          # These are enabled if the packages exist in this branch.
          # make defconfig will resolve their actual dependencies.
          CONFIG_PACKAGE_glinet-panel-firmware=y
          CONFIG_PACKAGE_kmod-input-touchscreen-cst353x=y

          EOF

          make defconfig

      # ============================================================
      # Show resulting configuration
      #
      # IMPORTANT:
      # Do not fail the build if a package isn't available.
      # ============================================================
      - name: Show Panel Configuration
        working-directory: openwrt
        run: |
          echo "========================================"
          echo "Panel packages"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(glinet-panel-ui|glinet-panel-firmware|kmod-input-touchscreen-cst353x|ucode-mod-lvgl|lvgl)' \
            .config || true

          echo
          echo "========================================"
          echo "Flint 4 target"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET_mediatek|CONFIG_TARGET.*gl-be14000' \
            .config || true

          echo
          echo "Configuration generated successfully."

      # ============================================================
      # Download sources
      # ============================================================
      - name: Download Source Packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      # ============================================================
      # Compile firmware
      # ============================================================
      - name: Compile Firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      # ============================================================
      # Collect firmware
      # ============================================================
      - name: Prepare Artifacts
        run: |
          mkdir -p bin-artifacts

          find openwrt/bin/targets/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.manifest" \
              -o -name "*.itb" \
              -o -name "*.img" \
            \) \
            -exec cp {} bin-artifacts/ \;

          echo "========================================"
          echo "Firmware artifacts"
          echo "========================================"

          ls -lah bin-artifacts/

      # ============================================================
      # Upload firmware
      # ============================================================
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-BE14000-OpenWrt-Flint4-PanelUI
          path: bin-artifacts/
