name: Build Flint 4 BE14000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository Branch
        uses: actions/checkout@v4
        with:
          repository: JiaY-shi/openwrt
          ref: flint4-support-blogic-pr

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find . -name "*librespeed*" -exec rm -rf {} +

      - name: Configure Target
        run: |
          make defconfig
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y" >> .config
          make olddefconfig
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Apply Touchscreen DTS Fix
        run: |
          DTS_FILE="target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts"
          if [ -f "$DTS_FILE" ]; then
            sed -i 's/touchscreen-swapped-x-y;/touchscreen-swapped-x-y;\n\t\t\ttouchscreen-inverted-x;\n\t\t\ttouchscreen-inverted-y;/g' "$DTS_FILE"
            echo "Successfully patched touchscreen inversion in DTS."
          else
            echo "DTS file not found, skipping patch."
          fi

      - name: Compile Firmware
        run: |
          make -j$(nproc)

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flint4-be14000-firmware
          path: bin/targets/mediatek/filogic/*
