name: Flint 4 bridger mac fix test
on:
  workflow_dispatch:

jobs:
  build:
    name: Build GL-BE14000 OpenWrt with Panel UI + YT9224 + SQM
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # Maximize Build Space
      # ============================================================
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ============================================================
      # Free Runner Space
      # ============================================================
      - name: Free Runner Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/microsoft
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # ============================================================
      # Build Dependencies
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # ============================================================
      # Checkout the known-good Flint 4 branch
      # ============================================================
      - name: Checkout Repository
        run: |
          git clone \
            --depth 1 \
            -b flint4-support \
            https://github.com/JiaY-shi/openwrt.git \
            openwrt

          cd openwrt

          echo "========================================"
          echo "BASELINE"
          echo "========================================"
          git log -1 --oneline

      # ============================================================
      # Apply Missing Flint 4 Fixes
      # ============================================================
      - name: Apply Missing Flint 4 Fixes
        run: |
          set -euo pipefail
          cd openwrt

          git config user.name "Flint 4 Build Bot"
          git config user.email "actions@github.com"

          BLOGIC_REPO="https://github.com/blogic/openwrt.git"
          BRIDGE_COMMIT="b1e81abd32ed4369fc1d413b5c33b6ce8ca5a3eb"
          RTL8261C_COMMIT="965af1a746277d281d8f0277de32d4ad73152c6d"
          PRODUCTION_DT_COMMIT="8fe7ba853d28cbb9f8a9e104d3fcde960fd96dae"

          BRIDGE_PATCH="target/linux/mediatek/patches-6.18/967-42-net-dsa-yt922x-add-hardware-bridge-offload.patch"
          RTL_PATCH="target/linux/generic/pending-6.18/744-net-phy-realtek-fix-RTL8261C-firmware-probe.patch"
          DTS="target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts"

          echo "========================================"
          echo "FETCHING MISSING FLINT 4 COMMITS"
          echo "========================================"

          git fetch --no-tags "$BLOGIC_REPO" "$BRIDGE_COMMIT"
          git fetch --no-tags "$BLOGIC_REPO" "$RTL8261C_COMMIT"
          git fetch --no-tags "$BLOGIC_REPO" "$PRODUCTION_DT_COMMIT"

          echo
          echo "========================================"
          echo "YT9224 HARDWARE BRIDGE OFFLOAD"
          echo "========================================"

          if [ -f "$BRIDGE_PATCH" ]; then
            echo "YT9224 bridge-offload patch is already present; skipping commit."
          else
            git show -s --format='%H %s' "$BRIDGE_COMMIT"
            git cherry-pick "$BRIDGE_COMMIT"
          fi

          echo
          echo "========================================"
          echo "RTL8261C FIRMWARE PROBE FIX"
          echo "========================================"

          if [ -f "$RTL_PATCH" ]; then
            echo "RTL8261C probe patch is already present; skipping commit."
          else
            git show -s --format='%H %s' "$RTL8261C_COMMIT"
            git cherry-pick "$RTL8261C_COMMIT"
          fi

          echo
          echo "========================================"
          echo "GL-BE14000 PRODUCTION DT FIX"
          echo "========================================"

          if grep -Fq 'reg = <0x0 0x40000000 0x0 0x80000000>;' "$DTS" && \
             grep -Fq 'touchscreen-inverted-x;' "$DTS" && \
             grep -Fq 'touchscreen-inverted-y;' "$DTS"; then
            echo "Production DT fix is already present; skipping commit."
          else
            git show -s --format='%H %s' "$PRODUCTION_DT_COMMIT"
            git cherry-pick "$PRODUCTION_DT_COMMIT"
          fi

          echo
          echo "========================================"
          echo "GL-BE14000 GMAC1 FACTORY MAC FIX"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/mediatek/dts/"
              "mt7988a-glinet-gl-be14000.dts"
          )

          if not p.exists():
              raise SystemExit(
                  f"ERROR: BE14000 DTS not found: {p}"
              )

          s = p.read_text()

          expected = 'nvmem-cells = <&macaddr_ethernet 1>;'

          if expected in s:
              print("GMAC1 factory MAC fix already present.")
              raise SystemExit(0)

          old = """&gmac1 {
          	phy-mode = "usxgmii";
          """

          new = """&gmac1 {
          	nvmem-cells = <&macaddr_ethernet 1>;
          	nvmem-cell-names = "mac-address";
          	phy-mode = "usxgmii";
          """

          if old not in s:
              raise SystemExit(
                  "ERROR: Could not locate expected gmac1 DTS block."
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Applied GMAC1 factory MAC assignment.")
          PY

          echo
          echo "========================================"
          echo "VERIFY APPLIED FIXES"
          echo "========================================"

          test -f "$BRIDGE_PATCH"
          grep -Fq 'yt922x_dsa_port_bridge_join' "$BRIDGE_PATCH"

          test -f "$RTL_PATCH"

          grep -F 'reg = <0x0 0x40000000 0x0 0x80000000>;' "$DTS"
          grep -F 'touchscreen-swapped-x-y;' "$DTS"
          grep -F 'touchscreen-inverted-x;' "$DTS"
          grep -F 'touchscreen-inverted-y;' "$DTS"

          # GMAC1 must use factory Ethernet MAC base + 1
          grep -F 'nvmem-cells = <&macaddr_ethernet 1>;' "$DTS"

          echo
          echo "========================================"
          echo "GMAC MAC ASSIGNMENTS"
          echo "========================================"

          grep -n -A8 -E '^&gmac[012]' "$DTS"

          echo
          echo "========================================"
          echo "PATCH FILES"
          echo "========================================"

          ls -lh "$BRIDGE_PATCH" "$RTL_PATCH"

          echo
          echo "========================================"
          echo "FINAL PATCHED HISTORY"
          echo "========================================"

          git log -6 --oneline

      # ============================================================
      # Add Blogic Panel UI Feed
      # ============================================================
      - name: Add Blogic Panel Feed
        run: |
          cd openwrt

          echo "src-git blogic https://github.com/blogic/feed-blogic.git" \
            >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # Bridger PR #15 - propagate netlink errors for PPE fallback
      # ============================================================
      - name: Add Bridger PR 15 Netlink Error Fix
        run: |
          set -euo pipefail
          cd openwrt

          BRIDGER_COMMIT="c8c4adf531c8176dd039db3dbb261f555bdf6586"
          BRIDGER_REPO="https://github.com/nbd168/bridger.git"

          echo "========================================"
          echo "LOCATING BRIDGER PACKAGE"
          echo "========================================"

          BRIDGER_MAKEFILE="$(grep -RIl --include=Makefile 'PKG_NAME.*bridger' package feeds 2>/dev/null | head -n1 || true)"

          if [ -z "$BRIDGER_MAKEFILE" ]; then
            echo "ERROR: Could not locate the OpenWrt bridger package Makefile."
            exit 1
          fi

          echo "Bridger package: $BRIDGER_MAKEFILE"

          BRIDGER_PKG_DIR="$(dirname "$BRIDGER_MAKEFILE")"
          mkdir -p "$BRIDGER_PKG_DIR/patches"

          PATCH_FILE="$BRIDGER_PKG_DIR/patches/999-nl-report-netlink-errors-back-to-caller.patch"

          echo
          echo "========================================"
          echo "FETCHING BRIDGER PR #15"
          echo "========================================"

          wget -qO "$PATCH_FILE"             "https://github.com/nbd168/bridger/commit/${BRIDGER_COMMIT}.patch"

          test -s "$PATCH_FILE"

          grep -Fq 'Subject: [PATCH] nl: report netlink errors back to the caller' "$PATCH_FILE"
          grep -Fq -- '-		return NL_SKIP;' "$PATCH_FILE"
          grep -Fq -- '+		return NL_STOP;' "$PATCH_FILE"

          echo "Downloaded Bridger commit:"
          echo "$BRIDGER_COMMIT"
          echo
          echo "Patch installed at:"
          echo "$PATCH_FILE"

          echo
          echo "========================================"
          echo "VERIFY BRIDGER PATCH APPLIES"
          echo "========================================"

          TMP_BRIDGER="$(mktemp -d)"
          trap 'rm -rf "$TMP_BRIDGER"' EXIT

          git clone -q "$BRIDGER_REPO" "$TMP_BRIDGER/bridger"
          cd "$TMP_BRIDGER/bridger"

          if git merge-base --is-ancestor "$BRIDGER_COMMIT" HEAD 2>/dev/null; then
            echo "Upstream bridger already contains PR #15."
            echo "ERROR: The extra OpenWrt patch would be redundant and may fail."
            exit 1
          fi

          git apply --check "$OLDPWD/$PATCH_FILE"

          echo "Bridger PR #15 patch applies cleanly."

      # ============================================================
      # Fix BE14000 Touchscreen Rotation
      # ============================================================
      - name: Fix BE14000 Touchscreen Rotation
        run: |
          cd openwrt

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/mediatek/dts/"
              "mt7988a-glinet-gl-be14000.dts"
          )

          if not p.exists():
              raise SystemExit(
                  f"ERROR: BE14000 DTS not found: {p}"
              )

          s = p.read_text()

          if (
              "touchscreen-swapped-x-y;" in s
              and "touchscreen-inverted-x;" in s
              and "touchscreen-inverted-y;" in s
          ):
              print("Touchscreen rotation fix already present.")
              raise SystemExit(0)

          old = "touchscreen-swapped-x-y;"

          new = """touchscreen-swapped-x-y;
                  touchscreen-inverted-x;
                  touchscreen-inverted-y;"""

          if old not in s:
              raise SystemExit(
                  "ERROR: touchscreen-swapped-x-y was not found "
                  "in the BE14000 DTS."
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Applied BE14000 180-degree touchscreen fix.")
          PY

          echo
          echo "===== Touchscreen DTS ====="

          grep -A12 -B4 "touchscreen@58" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

      # ============================================================
      # Generate Target Configuration
      # ============================================================
      - name: Generate Target Configuration
        run: |
          cd openwrt

          cat << 'EOF_CONFIG' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000=y

          # Standard LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # GL.iNet front-panel UI
          CONFIG_PACKAGE_glinet-panel-ui=y
          CONFIG_PACKAGE_ucode-mod-lvgl=y

          # SQM / CAKE
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_ip-full=y
          EOF_CONFIG

          make defconfig

      # ============================================================
      # Show Important Configuration
      # ============================================================
      - name: Verify Flint 4 Configuration
        run: |
          cd openwrt

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET_mediatek|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-be14000' \
            .config || true

          echo
          echo "========================================"
          echo "PANEL UI"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(glinet-panel-ui|ucode-mod-lvgl|lvgl)' \
            .config || true

          echo
          echo "========================================"
          echo "RTL8261C FIX"
          echo "========================================"

          ls -l \
            target/linux/generic/pending-6.18/744-net-phy-realtek-fix-RTL8261C-firmware-probe.patch

          echo
          echo "========================================"
          echo "PRODUCTION DT / TOUCHSCREEN"
          echo "========================================"

          grep -F 'reg = <0x0 0x40000000 0x0 0x80000000>;' \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

          grep -A10 -B3 "touchscreen@58" \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts || true

          echo
          echo "========================================"
          echo "GMAC1 FACTORY MAC"
          echo "========================================"

          grep -F 'nvmem-cells = <&macaddr_ethernet 1>;' \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

          grep -n -A8 '^&gmac1' \
            target/linux/mediatek/dts/mt7988a-glinet-gl-be14000.dts

      # ============================================================
      # Download Source Packages
      # ============================================================
      - name: Download Source Packages
        run: |
          cd openwrt

          make download -j$(nproc)

          find dl -size -1024c -exec rm -f {} \;

      # ============================================================
      # Compile Firmware
      # ============================================================
      - name: Compile Firmware
        run: |
          cd openwrt

          echo "Building on $(nproc) cores..."

          make -j$(nproc) || make -j1 V=s

      # ============================================================
      # Prepare Artifacts
      # ============================================================
      - name: Prepare Artifacts
        run: |
          cd openwrt

          mkdir -p ../firmware-out

          find bin/targets/mediatek/filogic/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.manifest" \
            \) \
            -exec cp {} ../firmware-out/ \;

          echo
          echo "========================================"
          echo "BUILD ARTIFACTS"
          echo "========================================"

          ls -lah ../firmware-out

      # ============================================================
      # Upload Firmware
      # ============================================================
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flint4-GL-BE14000-OpenWrt-PanelUI-YT9224-SQM-GMAC-BridgerPR15
          path: firmware-out
