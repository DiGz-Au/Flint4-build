name: Build GL.iNet 25.12 - Flint 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show available disk space
        run: |
          echo "========================================"
          echo "DISK SPACE"
          echo "========================================"
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time

          echo
          echo "========================================"
          echo "DISK SPACE AFTER DEPENDENCIES"
          echo "========================================"
          df -h

      - name: Clone GL.iNet OpenWrt 25.12
        run: |
          set -euo pipefail

          git clone \
            --branch openwrt-25.12 \
            --single-branch \
            https://github.com/gl-inet/gl-openwrt.git \
            openwrt

          cd openwrt

          echo "========================================"
          echo "GL.iNet OPENWRT BASELINE"
          echo "========================================"

          git log -1 --oneline
          git branch --show-current

      - name: Show GL.iNet BE14000 build documentation
        run: |
          set -euo pipefail
          cd openwrt

          echo "========================================"
          echo "BE14000 REPRODUCIBLE BUILD COMMIT"
          echo "========================================"

          git show --stat 7e511eb229 || true

          echo
          echo "========================================"
          echo "FULL COMMIT"
          echo "========================================"

          git show --format=fuller 7e511eb229 || true

      - name: Update and install feeds
        run: |
          set -euo pipefail
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure GL-BE14000
        run: |
          set -euo pipefail
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-be14000=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_iperf3=y
          EOF

          make defconfig

          echo "========================================"
          echo "VERIFY GL-BE14000 CONFIG"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET_mediatek|CONFIG_TARGET_mediatek_filogic|glinet_gl-be14000' \
            .config

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          grep -E \
            'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' \
            target/linux/mediatek/Makefile || true

          echo
          echo "========================================"
          echo "BE14000 DEVICE PACKAGES"
          echo "========================================"

          sed -n '/define Device\/glinet_gl-be14000/,/TARGET_DEVICES.*glinet_gl-be14000/p' \
            target/linux/mediatek/image/filogic.mk || true

      - name: Download sources
        run: |
          set -euo pipefail
          cd openwrt

          make download -j"$(nproc)"

          find dl -size -1024c -print -delete || true

          echo
          echo "========================================"
          echo "DISK SPACE AFTER DOWNLOAD"
          echo "========================================"
          df -h

      - name: Build GL-BE14000
        run: |
          set -euo pipefail
          cd openwrt

          echo "========================================"
          echo "BUILDING GL.iNet GL-BE14000"
          echo "========================================"

          make -j"$(nproc)" V=s || {
            echo
            echo "========================================"
            echo "PARALLEL BUILD FAILED"
            echo "RETRYING SINGLE-THREADED"
            echo "========================================"

            make -j1 V=s
          }

      - name: Show generated images
        if: always()
        run: |
          cd openwrt

          echo "========================================"
          echo "GENERATED IMAGES"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -printf '%f  %s bytes\n' \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "FINAL DISK SPACE"
          echo "========================================"
          df -h

      - name: Collect GL-BE14000 firmware
        if: success()
        run: |
          set -euo pipefail

          mkdir -p firmware

          find openwrt/bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -iname '*gl-be14000*' \
            -exec cp -v {} firmware/ \;

          if [ -f openwrt/bin/targets/mediatek/filogic/sha256sums ]; then
            cp -v \
              openwrt/bin/targets/mediatek/filogic/sha256sums \
              firmware/
          fi

          echo
          echo "========================================"
          echo "FIRMWARE ARTIFACT CONTENTS"
          echo "========================================"

          ls -lh firmware/

          if ! find firmware \
            -maxdepth 1 \
            -type f \
            -iname '*gl-be14000*' \
            | grep -q .; then

            echo "ERROR: No GL-BE14000 firmware image found."
            exit 1
          fi

      - name: Upload GL-BE14000 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glinet-be14000-openwrt-25.12
          path: firmware/
          if-no-files-found: error
          retention-days: 14
